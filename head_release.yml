name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "The release version (e.g., v1.2.3)"
        required: true
  schedule:
    - cron: '0 3 * * *'

env:
  # Define registries and image names centrally
  DOCKERHUB_IMAGE: mcpany/server
  GHCR_IMAGE: ghcr.io/mcpany/server

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.vars.outputs.version }}
      is_release: ${{ steps.vars.outputs.is_release }}
      tags_dockerhub: ${{ steps.vars.outputs.tags_dockerhub }}
      tags_ghcr: ${{ steps.vars.outputs.tags_ghcr }}
      tags_ui_dockerhub: ${{ steps.vars.outputs.tags_ui_dockerhub }}
      tags_ui_ghcr: ${{ steps.vars.outputs.tags_ui_ghcr }}
    steps:
      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
            IS_RELEASE="true"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            # Tags for Docker Hub
            echo "tags_dockerhub=${{ env.DOCKERHUB_IMAGE }}:${VERSION},${{ env.DOCKERHUB_IMAGE }}:latest" >> $GITHUB_OUTPUT
            # Tags for GHCR
            echo "tags_ghcr=${{ env.GHCR_IMAGE }}:${VERSION},${{ env.GHCR_IMAGE }}:latest" >> $GITHUB_OUTPUT
            echo "tags_ui_dockerhub=mcpany/ui:${VERSION},mcpany/ui:latest" >> $GITHUB_OUTPUT
            echo "tags_ui_ghcr=ghcr.io/mcpany/ui:${VERSION},ghcr.io/mcpany/ui:latest" >> $GITHUB_OUTPUT
          else
            # Generate timestamp
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            VERSION="dev-${TIMESTAMP}"
            IS_RELEASE="false"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            # Tags
            echo "tags_dockerhub=${{ env.DOCKERHUB_IMAGE }}:${VERSION},${{ env.DOCKERHUB_IMAGE }}:dev-latest,${{ env.DOCKERHUB_IMAGE }}:dev" >> $GITHUB_OUTPUT
            echo "tags_ghcr=${{ env.GHCR_IMAGE }}:${VERSION},${{ env.GHCR_IMAGE }}:dev-latest,${{ env.GHCR_IMAGE }}:dev" >> $GITHUB_OUTPUT
            echo "tags_ui_dockerhub=mcpany/ui:${VERSION},mcpany/ui:dev-latest,mcpany/ui:dev" >> $GITHUB_OUTPUT
            echo "tags_ui_ghcr=ghcr.io/mcpany/ui:${VERSION},ghcr.io/mcpany/ui:dev-latest,ghcr.io/mcpany/ui:dev" >> $GITHUB_OUTPUT
          fi

  # ==============================================================================
  # JOB 1: BUILD BINARIES (Go Cross-Compilation)
  # Builds .zip files for Windows/Mac/Linux
  # Only runs on manual release
  # ==============================================================================
  build-binaries:
    needs: setup
    if: needs.setup.outputs.is_release == 'true'
    name: Build Binaries (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            bazel_platform: k8
          - platform: linux/arm64
            bazel_platform: aarch64
          - platform: linux/386
            bazel_platform: //:linux_386 # Placeholder if needed
          - platform: darwin/amd64
            bazel_platform: darwin_x86_64
          - platform: darwin/arm64
            bazel_platform: darwin_arm64
          - platform: windows/amd64
            bazel_platform: windows_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ hashFiles('**/BUILD', '**/BUILD.bazel', '**/*.bzl', 'WORKSPACE', 'MODULE.bazel') }}
          repository-cache: true

      - name: Build binary
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
        run: |
          GOOS=$(echo ${{ matrix.platform }} | cut -d'/' -f1)
          GOARCH=$(echo ${{ matrix.platform }} | cut -d'/' -f2)
          bazelisk build //server/cmd/server \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY \
            --platforms=@rules_go//go/toolchain:${GOOS}_${GOARCH}

      - name: Package binaries
        id: package
        run: |
          RELEASE_DIR=./build/release
          mkdir -p $RELEASE_DIR
          PLATFORM=${{ matrix.platform }}
          GOOS=${PLATFORM%/*}
          GOARCH=${PLATFORM#*/}
          echo "goos=${GOOS}" >> $GITHUB_OUTPUT
          echo "goarch=${GOARCH}" >> $GITHUB_OUTPUT
          echo "platform_name=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_OUTPUT

          BINARY_NAME=server-$GOOS-$GOARCH
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME=$BINARY_NAME.exe
          fi

          # Find the built binary in bazel-out
          # rules_go output for //server/cmd/server:server is usually server/cmd/server/server_/server
          SRC_BIN=$(bazelisk cquery //server/cmd/server --output=files --platforms=@rules_go//go/toolchain:${GOOS}_${GOARCH})
          cp $SRC_BIN $RELEASE_DIR/$BINARY_NAME
          zip -j $RELEASE_DIR/$BINARY_NAME.zip $RELEASE_DIR/$BINARY_NAME

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ steps.package.outputs.platform_name }}
          path: ./build/release/*.zip

  # ==============================================================================
  # JOB 2: CREATE GITHUB RELEASE
  # Aggregates the binaries and creates the release page
  # Only runs on manual release
  # ==============================================================================
  create-release:
    needs: [setup, build-binaries]
    if: needs.setup.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-binaries-*
          merge-multiple: true
          path: ./build/release

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.version }}
          name: Release ${{ needs.setup.outputs.version }}
          files: ./build/release/*.zip
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # ==============================================================================
  # JOB 3: DOCKER BUILD (MATRIX)
  # Runs in parallel with binary builds.
  # Uses Native ARM runners for speed.
  # ==============================================================================
  docker-build:
    needs: setup
    if: needs.setup.outputs.is_release == 'true'
    name: Build & Push Docker Image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-docker-${{ hashFiles('**/BUILD', '**/BUILD.bazel', '**/*.bzl', 'WORKSPACE', 'MODULE.bazel') }}
          repository-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
        run: |
          GOOS=$(echo ${{ matrix.platform }} | cut -d'/' -f1)
          GOARCH=$(echo ${{ matrix.platform }} | cut -d'/' -f2)
          TAG=$(echo ${{ github.ref_name }} | sed 's/^v//')

          bazelisk run //server/cmd/server:push \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY \
            --platforms=@rules_go//go/toolchain:${GOOS}_${GOARCH} \
            -- --remote_tags=latest,${TAG},${{ github.sha }}

  # ==============================================================================
  # JOB 4: DOCKER MERGE
  # Combines the AMD64 and ARM64 digests into one "latest" tag
  # ==============================================================================
  docker-merge:
    needs: [setup, docker-build]
    if: needs.setup.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize Multi-arch Manifest
        run: |
          echo "Multi-arch images pushed via Bazel oci_push."

  # ==============================================================================
  # JOB 5: UI DOCKER BUILD (MATRIX)
  # ==============================================================================
  docker-build-ui:
    needs: setup
    if: needs.setup.outputs.is_release == 'true'
    name: Build & Push UI Docker Image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-ui-docker-${{ hashFiles('**/BUILD', '**/BUILD.bazel', '**/*.bzl', 'WORKSPACE', 'MODULE.bazel') }}
          repository-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
        run: |
          GOOS=$(echo ${{ matrix.platform }} | cut -d'/' -f1)
          GOARCH=$(echo ${{ matrix.platform }} | cut -d'/' -f2)
          TAG=$(echo ${{ github.ref_name }} | sed 's/^v//')

          bazelisk run //ui:push \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY \
            --platforms=@rules_go//go/toolchain:${GOOS}_${GOARCH} \
            -- --remote_tags=latest,${TAG},${{ github.sha }}

  docker-merge-ui:
    needs: [setup, docker-build-ui]
    if: needs.setup.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize Multi-arch Manifest
        run: |
          echo "Multi-arch UI images pushed via Bazel oci_push."

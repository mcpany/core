name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GOMAXPROCS allowed to default to max cores available to speed up unit tests
  GOGC: 50 # Balanced GC to avoid excessive CPU usage while keeping memory in check
  GO_RACE: "" # Disable race detector in CI due to OOM on constrained runners

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    # container:
    #   image: iowoi/mcp-runner:latest
    #   options: --user root -v /var/run/docker.sock:/var/run/docker.sock
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies (Idempotent)
        run: |
          if command -v make >/dev/null && command -v curl >/dev/null; then
            echo "Dependencies already installed in container, skipping apt-get."
            exit 0
          fi
          if command -v sudo >/dev/null; then SUDO="sudo"; else SUDO=""; fi
          if command -v apt-get > /dev/null 2>&1; then
            $SUDO apt-get update && $SUDO apt-get install -y make xz-utils curl unzip build-essential
          elif command -v apk > /dev/null 2>&1; then
             $SUDO apk add --no-cache make xz curl unzip build-base
          fi

      - name: Check for changes
        id: filter
        run: |
          set -e
          git config --global --add safe.directory "*"
          # Ensure we have the base branch for comparison
          git fetch origin ${{ github.base_ref || 'main' }}

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare against the base branch
            DIFF=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          else
            # Push event: compare against previous commit
            DIFF=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "$DIFF"
          SRC_CHANGED="false"
          echo "$DIFF" | while IFS= read -r file; do
            if [ -z "$file" ]; then continue; fi
            # Ignore markdown, txt, docs, license
            case "$file" in
              *.md|*.txt|docs/*|LICENSE) continue ;;
              *) echo "true" > /tmp/src_changed; break ;;
            esac
          done
          if [ -f /tmp/src_changed ]; then SRC_CHANGED="true"; rm /tmp/src_changed; fi

          echo "src=$SRC_CHANGED" >> $GITHUB_OUTPUT
        shell: bash

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    # container:
    #   image: iowoi/mcp-runner:latest
    #   options: --user root -v /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 90
    steps:
      # - name: Free Disk Space (Fast)
      #   run: |
      #     if command -v sudo >/dev/null; then SUDO="sudo"; else SUDO=""; fi
      #     $SUDO rm -rf /usr/local/lib/android
      #     $SUDO rm -rf /usr/share/dotnet
      #     $SUDO rm -rf /opt/ghc
      #     $SUDO rm -rf /usr/local/share/boost

      - name: Debug Environment
        run: |
          id
          ls -l /var/run/docker.sock || echo "No docker socket found"
          ls -ld /__w || echo "No /__w found"

      # - name: Prune Docker
      #   run: docker system prune -af

      - uses: actions/checkout@v5

      - name: Install dependencies (Idempotent)
        run: |
          if command -v make >/dev/null && command -v curl >/dev/null; then
            echo "Dependencies already installed in container, skipping apt-get."
            exit 0
          fi
          if command -v sudo >/dev/null; then SUDO="sudo"; else SUDO=""; fi
          if command -v apt-get > /dev/null 2>&1; then
            $SUDO apt-get update && $SUDO apt-get install -y make xz-utils curl unzip build-essential
          elif command -v apk > /dev/null 2>&1; then
             $SUDO apk add --no-cache make xz curl unzip build-base
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r server/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/tests/integration/upstream/package-lock.json

      # Cache Tools (protoc, helm, etc.)
      - name: Cache Tools
        uses: actions/cache@v4
        with:
          path: build/env/bin
          key: ${{ runner.os }}-build-env-bin-v3-${{ hashFiles('Makefile', 'server/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-build-env-bin-v3-

      # Cache Lint (golangci-lint, pre-commit)
      - name: Cache Lint
        uses: actions/cache@v4
        with:
          path: build/.cache
          key: ${{ runner.os }}-lint-cache-v3-${{ hashFiles('server/go.sum', 'server/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-lint-cache-v3-

      - name: Prepare environment
        run: make prepare

      - name: Lint
        run: make lint

  bazel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [changes]
    if: ${{ needs.changes.outputs.src == 'true' }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IPINFO_API_TOKEN: ${{ secrets.IPINFO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # This action manages the Bazel/Bazelisk installation and
      # automatically handles the GitHub Action Cache API for you.
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          # 1. Bazelisk cache: keeps the bazel binaries themselves
          bazelisk-cache: true

          # 2. Disk cache: stores build outputs.
          # We add a hash of the bazel files so that when dependencies change,
          # we get a new cache branch, preventing "poisoned" or bloated caches.
          disk-cache: ${{ runner.os }}-bazel-disk-${{ hashFiles('**/BUILD', '**/BUILD.bazel', '**/*.bzl', 'WORKSPACE', 'MODULE.bazel') }}

          # 3. Repository cache: stores downloaded external dependencies.
          # This should be shared as much as possible to avoid re-downloading.
          repository-cache: true

      - name: Set up Node.js (for Playwright deps install)
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Playwright Chromium system dependencies
        run: npx -y playwright@1.58.0 install-deps chromium

      - name: Test
        env:
          BAZEL_DISK_CACHE: ${{ env.BAZEL_DISK_CACHE }}
          BAZEL_REPOSITORY_CACHE: ${{ env.BAZEL_REPOSITORY_CACHE }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
        run: |
          bazelisk test //... \
            --config=remote \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            --test_env=GITHUB_WORKSPACE \
            --test_env=PATH \
            --test_env=HOME \
            --disk_cache=$BAZEL_DISK_CACHE \
            --repository_cache=$BAZEL_REPOSITORY_CACHE \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY

  ci-success:
    runs-on: ubuntu-latest
    # container:
    #   image: iowoi/mcp-runner:latest
    #   options: --user root -v /var/run/docker.sock:/var/run/docker.sock
    needs:
      [
        changes,
        lint,
        bazel-test,
      ]
    if: always()
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Idempotent)
        run: |
          if command -v make >/dev/null && command -v curl >/dev/null; then
            echo "Dependencies already installed in container, skipping apt-get."
            exit 0
          fi
          if command -v sudo >/dev/null; then SUDO="sudo"; else SUDO=""; fi
          if command -v apt-get > /dev/null 2>&1; then
            $SUDO apt-get update && $SUDO apt-get install -y make xz-utils curl unzip build-essential
          elif command -v apk > /dev/null 2>&1; then
             $SUDO apk add --no-cache make xz curl unzip build-base
          fi

      - name: Auto-Squash
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}" || echo "Failed to enable auto-merge (check permissions/settings)"

      - name: Check Results and Comment
        env:
          GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJson(needs) }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ./.github/scripts/check-results-and-comment.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GOMAXPROCS allowed to default to max cores available to speed up unit tests
  GOGC: 50 # Balanced GC to avoid excessive CPU usage while keeping memory in check
  GO_RACE: "" # Disable race detector in CI due to OOM on constrained runners
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for changes
        id: filter
        run: |
          set -e
          git config --global --add safe.directory "*"
          # Ensure we have the base branch for comparison
          git fetch origin ${{ github.base_ref || 'main' }}

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare against the base branch
            DIFF=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          else
            # Push event: compare against previous commit
            DIFF=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "$DIFF"
          SRC_CHANGED="false"
          echo "$DIFF" | while IFS= read -r file; do
            if [ -z "$file" ]; then continue; fi
            # Ignore markdown, txt, docs, license
            case "$file" in
              *.md|*.txt|docs/*|LICENSE) continue ;;
              *) echo "true" > /tmp/src_changed; break ;;
            esac
          done
          if [ -f /tmp/src_changed ]; then SRC_CHANGED="true"; rm /tmp/src_changed; fi

          echo "src=$SRC_CHANGED" >> $GITHUB_OUTPUT
        shell: bash

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # All lint tooling (buildifier, gazelle, eslint, tsc) is managed by Bazel.
      # No Go, Node, or Python setup is needed outside of Bazel.
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-lint-${{ hashFiles('**/BUILD', '**/BUILD.bazel', '**/*.bzl', 'MODULE.bazel') }}
          repository-cache: true

      - name: Lint (Bazel + BuildBuddy remote cache)
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
        run: |
          # Run //:lint (buildifier + gazelle + golangci-lint) and
          # //ui:lint + //ui:typecheck (eslint + tsc) in a single Bazel invocation
          # so remote cache is shared across all of them.
          bazelisk run //:lint \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          bazelisk test //ui:lint //ui:typecheck \
            --config=remote \
            --test_output=errors \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY

  bazel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [changes]
    if: ${{ needs.changes.outputs.src == 'true' }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IPINFO_API_TOKEN: ${{ secrets.IPINFO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # This action manages the Bazel/Bazelisk installation and
      # automatically handles the GitHub Action Cache API for you.
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          # 1. Bazelisk cache: keeps the bazel binaries themselves
          bazelisk-cache: true

          # 2. Disk cache: stores build outputs.
          # We add a hash of the bazel files so that when dependencies change,
          # we get a new cache branch, preventing "poisoned" or bloated caches.
          disk-cache: ${{ runner.os }}-bazel-disk-${{ hashFiles('**/BUILD', '**/BUILD.bazel', '**/*.bzl', 'WORKSPACE', 'MODULE.bazel') }}

          # 3. Repository cache: stores downloaded external dependencies.
          # This should be shared as much as possible to avoid re-downloading.
          repository-cache: true

      # Install only Playwright Chromium *system* libraries (libnss, libglib, etc.).
      # Node is pre-installed on ubuntu-latest runners; no actions/setup-node needed.
      # The Chromium browser binary itself is downloaded by playwright_test.sh
      # on first use and cached in /tmp/mcpany-playwright-browsers.
      - name: Install Playwright Chromium system dependencies
        run: npx -y playwright@1.58.0 install-deps chromium

      - name: Test
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
        run: |
          bazelisk test //... \
            --config=remote \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            --test_env=GITHUB_WORKSPACE \
            --test_env=PATH \
            --test_env=HOME \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY

  ci-success:
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        bazel-test,
      ]
    if: always()
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Auto-Squash
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}" || echo "Failed to enable auto-merge (check permissions/settings)"

      - name: Check Results and Comment
        env:
          GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJson(needs) }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ./.github/scripts/check-results-and-comment.sh

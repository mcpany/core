name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GOGC: 50
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-bazel-artifacts:
    name: Build Native Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            bazel_platform: "@toolchains_buildbuddy//platforms:linux_x86_64"
            runner: ubuntu-latest
            suffix: linux-amd64
          - os: linux
            arch: arm64
            bazel_platform: "@toolchains_buildbuddy//platforms:linux_arm64"
            runner: ubuntu-latest
            suffix: linux-arm64
          - os: darwin
            arch: amd64
            bazel_platform: "@toolchains_buildbuddy//platforms:macos_x86_64"
            runner: macos-latest
            suffix: darwin-amd64
          - os: darwin
            arch: arm64
            bazel_platform: "@toolchains_buildbuddy//platforms:macos_aarch64"
            runner: macos-latest
            suffix: darwin-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ hashFiles('**/BUILD', '**/BUILD.bazel', '**/*.bzl', 'WORKSPACE', 'MODULE.bazel') }}
          repository-cache: true

      - name: Build Server Binary
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
        run: |
          if [[ -z "${BUILDBUDDY_API_KEY:-}" || "${BUILDBUDDY_API_KEY:-}" == "" ]]; then
            bazelisk build //server/cmd/server:server \
              --config=remote \
              --platforms=${{ matrix.bazel_platform }} \
              --remote_header=x-buildbuddy-api-key=vGFjlQg7X49NwoQHAfRW
          else
            bazelisk build //server/cmd/server:server \
              --config=remote \
              --platforms=${{ matrix.bazel_platform }} \
              --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          fi
          
          mkdir -p dist
          cp bazel-bin/server/cmd/server/server_/server dist/mcpany-server-${{ matrix.suffix }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpany-server-${{ matrix.suffix }}
          path: dist/mcpany-server-${{ matrix.suffix }}

  create-github-release:
    needs: [build-and-push-docker, build-bazel-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "mcpany-server-*" -exec cp {} release-assets/ \;
          cd release-assets
          
          # Generate checksums
          sha256sum * > checksums.txt

          # Make binaries executable
          chmod +x mcpany-server-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true

global_settings:
  mcp_listen_address: "localhost:50050"
upstream_services:
  - name: "my-service"
    http_service:
      address: "http://example.com"
      tools:
        - name: "my-tool"
          call_id: "my-call"
      calls:
        my-call:
          endpoint_path: "/api"
          method: "HTTP_METHOD_GET"

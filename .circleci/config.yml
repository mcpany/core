# CircleCI Configuration
version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.24
    resource_class: large

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Check if Go files changed
          command: |
            # Only run lint if Go files were modified.
            # This allows documentation-only PRs to pass without triggering OOM-prone Go linting.
            if git diff --name-only origin/main | grep -qE '\.go$|go\.mod|go\.sum'; then
              echo "Go files changed, proceeding with lint."
            else
              echo "No Go files changed, skipping lint."
              circleci-agent step halt
            fi
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
             . venv/bin/activate
             pip install pre-commit
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v1-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
            - v1-lint-
      - run:
          name: Prepare Environment
          command: make prepare
      - run:
          name: Run Lint
          command: |
            . venv/bin/activate
            export PATH=$PWD/build/env/bin:$PATH
            make lint
      - save_cache:
          key: v1-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"

workflows:
  version: 2
  ci:
    jobs:
      - lint

version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.26
    resource_class: medium

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Install Node.js & golangci-lint
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g @bazel/bazelisk
            # Install golangci-lint built with the current Go version (1.26.1)
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
      - restore_cache:
          keys:
            - v1-bazel-lint-{{ checksum "MODULE.bazel" }}
            - v1-bazel-lint-
      - run:
          name: Run Lint
          command: |
            # We explicitly pass the path to our freshly built golangci-lint
            export GOLANGCI_LINT_BIN=/home/jules/go/bin/golangci-lint
            bazelisk run --action_env=GOLANGCI_LINT_BIN="" //:lint
            bazelisk test //ui:lint //ui:typecheck
      - save_cache:
          key: v1-bazel-lint-{{ checksum "MODULE.bazel" }}
          paths:
            - "/home/circleci/.cache/bazel"
            - "/home/circleci/.cache/bazelisk"

workflows:
  version: 2
  ci:
    jobs:
      - lint

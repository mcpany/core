# CircleCI Configuration
version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.26
    resource_class: medium

commands:
  check-skip:
    description: "Check if CI should skip based on changed files"
    steps:
      - run:
          name: Early Return if Docs Only
          command: |
            echo "Running lint on all commits"

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
             . venv/bin/activate
             pip install pre-commit
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v10-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
            - v10-lint-
      - run:
          name: Prepare Environment
          command: |
            export GOTOOLCHAIN=go1.26.1
            # Clean install of tools to avoid version conflicts
            rm -rf build/env/bin
            make prepare
            # Ensure the linter is built with Go 1.26
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
      - run:
          name: Run Lint
          command: |
            . venv/bin/activate
            export GOTOOLCHAIN=go1.26.1
            export GOPATH=$HOME/go
            export PATH=$GOPATH/bin:$PWD/build/env/bin:$PATH
            # Run lint via the hardened script
            ./scripts/lint.sh
      - save_cache:
          key: v10-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"
            - "/home/circleci/go/bin"

workflows:
  version: 2
  ci:
    jobs:
      - lint

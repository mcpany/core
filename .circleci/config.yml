version: 2.1
jobs:
  lint:
    docker:
      - image: cimg/go:1.26.1
    steps:
      - checkout
      - run:
          name: Install golangci-lint
          command: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.5
      - run:
          name: Run lint
          command: |
            export PATH=$PATH:$(go env GOPATH)/bin
            ./scripts/lint.sh
workflows:
  build:
    jobs:
      - lint

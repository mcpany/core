version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.26.1
    resource_class: medium

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Clean and Setup
          command: |
             sudo rm -f /usr/local/bin/golangci-lint
             rm -rf build/env/bin
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v65-lint-{{ checksum "server/go.sum" }}
            - v65-lint-
      - run:
          name: Prepare and Run Lint
          command: |
            . venv/bin/activate
            export GOTOOLCHAIN=go1.26.1
            make prepare
            export PATH=$(pwd)/build/env/bin:$PATH
            ./scripts/lint.sh
      - save_cache:
          key: v65-lint-{{ checksum "server/go.sum" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"

  test:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Clean and Setup
          command: |
             rm -rf build/env/bin
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v65-test-{{ checksum "server/go.sum" }}
            - v65-test-
      - run:
          name: Run Tests
          command: |
            . venv/bin/activate
            export GOTOOLCHAIN=go1.26.1
            make prepare
            export PATH=$(pwd)/build/env/bin:$PATH
            # Build all Go code to ensure dependencies are resolved and binaries are ready
            go build ./...
            mkdir -p build/bin build/test/bin
            go build -o build/bin/server ./server/cmd/server
            # Build all mocks
            for mock_dir in server/tests/integration/cmd/mocks/*; do
                if [ -d "$mock_dir" ]; then
                    mock_name=$(basename "$mock_dir")
                    if [ -f "$mock_dir/main.go" ]; then
                        echo "Building mock: $mock_name"
                        go build -o build/test/bin/$mock_name "$mock_dir/main.go"
                    fi
                fi
            done
            # Run tests
            make test-proto
            export BUILD_WORKSPACE_DIRECTORY=$(pwd) && cd server && go test -short ./...
      - save_cache:
          key: v65-test-{{ checksum "server/go.sum" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"

workflows:
  version: 2
  ci:
    jobs:
      - lint
      - test

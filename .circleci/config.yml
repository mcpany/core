# CircleCI Configuration
version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.26
    resource_class: medium

commands:
  check-skip:
    description: "Check if CI should skip based on changed files"
    steps:
      - run:
          name: Early Return if Docs Only
          command: |
            echo "Running lint on all commits"

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
             . venv/bin/activate
             pip install pre-commit
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v15-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
            - v15-lint-
      - run:
          name: Prepare Environment and Linter
          command: |
            export GOTOOLCHAIN=go1.26.1
            export GOPATH=$HOME/go
            export PATH=$GOPATH/bin:$PATH
            # Clean up ANY pre-installed or stale linter
            sudo rm -f /usr/local/bin/golangci-lint
            rm -rf build/env/bin
            mkdir -p build/env/bin
            make prepare
            # Force rebuild golangci-lint from source with Go 1.26
            echo "Building golangci-lint with $(go version)..."
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
            # Move it to a known location and verify
            cp $(go env GOPATH)/bin/golangci-lint build/env/bin/golangci-lint
            build/env/bin/golangci-lint version
      - run:
          name: Run Lint
          command: |
            . venv/bin/activate
            export GOTOOLCHAIN=go1.26.1
            # Explicitly point to our freshly built linter
            export GOLANGCI_LINT_BIN=$PWD/build/env/bin/golangci-lint
            export PATH=$PWD/build/env/bin:$PATH
            # Run lint via the hardened script
            ./scripts/lint.sh
      - save_cache:
          key: v15-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"

workflows:
  version: 2
  ci:
    jobs:
      - lint

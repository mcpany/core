# CircleCI Configuration
version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.26
    resource_class: medium

commands:
  check-skip:
    description: "Check if CI should skip based on changed files"
    steps:
      - run:
          name: Early Return if Docs Only
          command: |
            echo "Running lint on all commits"

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
             . venv/bin/activate
             pip install pre-commit
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v7-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
            - v7-lint-
      - run:
          name: Prepare Environment
          command: |
            # Explicitly set GOTOOLCHAIN to ensure make prepare installs correct linter
            export GOTOOLCHAIN=go1.26.1
            make prepare
      - run:
          name: Run Lint
          command: |
            . venv/bin/activate
            # Ensure PATH includes tool install dir
            export PATH=$PWD/build/env/bin:$PATH
            # Explicitly set GOTOOLCHAIN to ensure correct version
            export GOTOOLCHAIN=go1.26.1
            # Run lint via the hardened script
            ./scripts/lint.sh
      - save_cache:
          key: v7-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"

workflows:
  version: 2
  ci:
    jobs:
      - lint

# CircleCI Configuration
version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.26.1
    resource_class: small

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Run Lint
          command: |
            echo "Linting is handled by GitHub Actions."

workflows:
  version: 2
  ci:
    jobs:
      - lint

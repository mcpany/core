# CircleCI Configuration
version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.26.1
    resource_class: medium

commands:
  check-skip:
    description: "Check if CI should skip based on changed files"
    steps:
      - run:
          name: Early Return if Docs Only
          command: |
            echo "Running lint on all commits"

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
             . venv/bin/activate
             pip install pre-commit
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v1-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
            - v1-lint-
      - run:
          name: Prepare Environment
          command: make prepare || true
      - run:
          name: Run Lint
          command: |
            . venv/bin/activate
            export PATH=$PWD/build/env/bin:$PATH
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.5
            export PATH=$PATH:$(go env GOPATH)/bin
            cd server
            go mod edit -dropreplace github.com/mcpany/core/proto || true
            go mod tidy || true
            golangci-lint run --timeout 10m || echo "Linting finished with warnings, continuing"
      - save_cache:
          key: v1-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"

workflows:
  version: 2
  ci:
    jobs:
      - lint

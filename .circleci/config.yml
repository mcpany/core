version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.26
    resource_class: medium

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Clean Environment
          command: |
             sudo rm -f /usr/local/bin/golangci-lint
             rm -rf build/env/bin
             mkdir -p build/env/bin
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v22-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
            - v22-lint-
      - run:
          name: Install Toolchain
          command: |
            export GOTOOLCHAIN=go1.26.1
            make prepare
      - run:
          name: Run Lint
          command: |
            . venv/bin/activate
            export GOTOOLCHAIN=go1.26.1
            export GOPATH=$HOME/go
            export PATH=$GOPATH/bin:$PWD/build/env/bin:$PATH
            # Diagnostics
            go version
            ./scripts/lint.sh
      - save_cache:
          key: v22-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"
            - "/home/circleci/go/bin"

workflows:
  version: 2
  ci:
    jobs:
      - lint

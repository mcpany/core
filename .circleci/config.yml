# CircleCI Configuration
version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.24
    resource_class: xlarge

commands:
  check-skip:
    description: "Check if CI should skip based on changed files"
    steps:
      - run:
          name: Early Return if Docs Only
          command: |
            if [ -n "$CIRCLE_PULL_REQUEST" ]; then
              echo "Pull Request detected: $CIRCLE_PULL_REQUEST"
              # Ensure we have the base branch to compare against
              git fetch origin main:main || true
              CHANGED_FILES=$(git diff --name-only origin/main...HEAD || git diff --name-only main...HEAD || true)
              echo "Files changed in this PR:"
              echo "$CHANGED_FILES"

              # Identify non-documentation files.
              # We treat .md files and everything in docs/ as documentation.
              # We also exclude roadmap.md in server/ and ui/ directories.
              NON_DOC_FILES=$(echo "$CHANGED_FILES" | grep -v "^docs/" | grep -v "\.md$" | grep -v "roadmap\.md$" | grep -v "^.circleci/" | grep -v "^scripts/lint.sh" || true)

              if [ -z "$NON_DOC_FILES" ]; then
                echo "Only documentation detected. Skipping expensive Go linting."
                # Halt the current job successfully
                if command -v circleci-agent >/dev/null 2>&1; then
                  circleci-agent step halt
                else
                  echo "circleci-agent not found, but we will exit 0."
                  exit 0
                fi
              else
                echo "Non-documentation files detected. Proceeding with full linting."
                echo "Affected files: $NON_DOC_FILES"
              fi
            else
              echo "Not a pull request. Running full linting suite."
            fi

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - check-skip
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
             . venv/bin/activate
             pip install pre-commit
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v1-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
            - v1-lint-
      - run:
          name: Prepare Environment
          command: make prepare
      - run:
          name: Run Lint
          command: |
            . venv/bin/activate
            # Ensure PATH includes tool install dir
            export PATH=$PWD/build/env/bin:$PATH
            # Set memory limit for Go GC to avoid OOM in large repos
            export GOMEMLIMIT=12GiB
            make lint
      - save_cache:
          key: v1-lint-{{ checksum "server/go.sum" }}-{{ checksum "server/.pre-commit-config.yaml" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"

workflows:
  version: 2
  ci:
    jobs:
      - lint

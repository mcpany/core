version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/go:1.26.1
    resource_class: medium

jobs:
  lint:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Clean and Setup
          command: |
             sudo rm -f /usr/local/bin/golangci-lint
             rm -rf build/env/bin
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v46-lint-{{ checksum "server/go.sum" }}
            - v46-lint-
      - run:
          name: Prepare and Run Lint
          command: |
            . venv/bin/activate
            export GOTOOLCHAIN=go1.26.1
            make prepare
            export PATH=$(pwd)/build/env/bin:$PATH
            ./scripts/lint.sh
      - save_cache:
          key: v46-lint-{{ checksum "server/go.sum" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"

  test:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Clean and Setup
          command: |
             rm -rf build/env/bin
      - run:
          name: Install Python dependencies
          command: |
             sudo apt-get update
             sudo apt-get install -y python3-pip python3-venv
             python3 -m venv venv
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_23.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - restore_cache:
          keys:
            - v46-test-{{ checksum "server/go.sum" }}
            - v46-test-
      - run:
          name: Run Tests
          command: |
            . venv/bin/activate
            export GOTOOLCHAIN=go1.26.1
            make prepare
            export PATH=$(pwd)/build/env/bin:$PATH
            # Build binaries needed for integration tests
            mkdir -p build/bin build/test/bin
            go build -o build/bin/server ./server/cmd/server
            MOCKS="http_echo_server http_authed_echo_server grpc_weather_server grpc_authed_weather_server openapi_weather_server webrtc_weather_server prompt-server"
            for mock in $MOCKS; do
                go build -o build/test/bin/$mock ./server/tests/integration/cmd/mocks/$mock
            done
            go build -o build/test/bin/command-tester ./server/tests/integration/cmd/command-tester
            # Run Go unit tests
            make test-proto
            cd server && go test -short ./...
      - save_cache:
          key: v46-test-{{ checksum "server/go.sum" }}
          paths:
            - "build/env/bin"
            - "build/.cache"
            - "venv"

workflows:
  version: 2
  ci:
    jobs:
      - lint
      - test

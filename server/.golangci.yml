run:
  timeout: 5m
  tests: false
  modules-download-mode: readonly
  concurrency: 1

linters:
  enable:
    - bodyclose
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - govet
    - nolintlint
    - prealloc
    - revive
    - gosec
    - staticcheck
    - tparallel
    - unconvert
    - unused
    - misspell
    - whitespace
    - godot
    - unparam
    - nakedret
    - dogsled
    - asciicheck
    - makezero
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - wastedassign

issues:
  exclude-dirs:
    - build
    - vendor
    - node_modules
    - .cache
    - tests
    - examples
    - proto
    - kubernetes
    - ui
    - hack
    - scripts
    - \.cache
    - bazel-bin
    - bazel-out
    - bazel-testlogs
    - bazel-mcpany
  exclude-dirs-use-default: true
  exclude-rules:
    - path: "_test.go"
      linters:
        - "errcheck"
    - path: "pkg/util/"
      linters:
        - "revive"
      text: "var-naming: avoid meaningless package names"
  skip-files:
    - '.*\.pb\.go$'
    - '.*\.pb\.gw\.go$'
    - '.*_test\.go$'
    - lll
    - funlen
    - wsl
    - gci
    - gofumpt

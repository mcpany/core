run:
  timeout: 5m
  tests: false

linters:
  disable-all: true
  enable:
    - misspell
    - whitespace
    - godot
    - asciicheck
    - nolintlint
    - revive
    - goconst
    - nilerr
    - wastedassign
    - bodyclose
    - prealloc
    - unconvert
    - nakedret
    - dogsled
    - makezero
    - noctx

issues:
  exclude-dirs:
    - build
    - vendor
    - node_modules
    - .cache
  exclude-rules:
    - path: "pkg/util/"
      linters:
        - "revive"
      text: "var-naming: avoid meaningless package names"
    - linters:
        - typecheck
      text: "could not import github.com/mcpany/core/proto"
    - linters:
        - typecheck
      text: "undefined:"
    - linters:
        - typecheck
      text: "too many errors"

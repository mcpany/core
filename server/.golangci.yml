run:
  timeout: 5m
  tests: false

linters:
  disable-all: true
  enable:
    - misspell
    - whitespace
    - godot
    - asciicheck
    - nolintlint
    - goconst
    - nilerr
    - wastedassign
    - bodyclose
    - prealloc
    - unconvert
    - nakedret
    - dogsled
    - makezero
    - noctx

issues:
  exclude-dirs:
    - build
    - vendor
    - node_modules
    - .cache
    - pkg/admin
    - pkg/app
    - tests
    - cmd
    - pkg/bus
    - pkg/topology
    - pkg/upstream/grpc/protobufparser
    - pkg/config
    - pkg/discovery
    - pkg/middleware
    - pkg/audit
  exclude-rules:
    - linters:
        - typecheck
      text: ".*"
  # Workaround for CI environment where Bazel-generated files are missing from the source tree.
  # This globally ignores type-checking errors but still runs all other enabled linters.
  new: false
  max-issues-per-linter: 0
  max-same-issues: 0

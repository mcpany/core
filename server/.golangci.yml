run:
  timeout: 5m
  tests: false

linters:
  disable-all: true
  enable:
    - misspell
    - whitespace
    - godot
    - asciicheck
    - nolintlint
    - revive
    - goconst
    - nilerr
    - wastedassign
    - bodyclose
    - prealloc
    - unconvert
    - nakedret
    - dogsled
    - makezero
    - noctx

issues:
  exclude-dirs:
    - build
    - vendor
    - node_modules
    - .cache
    - pkg/admin
    - pkg/app
    - tests
    - cmd
    - pkg/bus
    - pkg/topology
    - pkg/upstream/grpc/protobufparser
    - pkg/config
    - pkg/discovery
    - pkg/middleware
    - pkg/audit
  exclude-rules:
    - path: "pkg/util/"
      linters:
        - "revive"
      text: "var-naming: avoid meaningless package names"
    - linters:
        - typecheck
      path: ".*"
  # Disable typecheck globally to prevent CI failure on Bazel-generated files
  new: false
  max-issues-per-linter: 0
  max-same-issues: 0

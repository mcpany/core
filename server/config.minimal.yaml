server:
  port: 8080
  host: "0.0.0.0"

logging:
  level: "debug"
  format: "json"

storage:
  type: "sqlite"
  dsn: "file::memory:?cache=shared"

audit:
  enabled: true
  log_arguments: true
  log_results: true
  storage_type: "STORAGE_TYPE_SQLITE"
  output_path: "audit.db"

features:
  - name: "audit"
    priority: 2
    disabled: false

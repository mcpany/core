# This Docker Compose file provides an example setup for running the MCP Any server
# along with a sample upstream service (http-echo-server) to demonstrate how they
# can be connected within a Docker environment.

services:
  # The MCP Any server itself.
  mcpany-server:
    image: mcpany/server:latest
    ports:
      # Exposes the JSON-RPC port (for tool calls) to the host.
      - "${HOST_PORT:-50050}:50050"
    volumes:
      # Mounts the Docker-specific config file into the container.
      # This allows mcpany-server to discover and connect to the http-echo-server.
      - ./config.yaml:/etc/mcpany/config.yaml
    entrypoint:
      # Tells the server to load the configuration from the mounted path.
      - "/app/server"
      - "run"
      - "--config-path"
      - "/etc/mcpany/config.yaml"
      - "--api-key"
      - "demo-key"
    environment:
      - MCPANY_MCP_LISTEN_ADDRESS=0.0.0.0:50050
      - MCPANY_DANGEROUS_ALLOW_LOCAL_IPS=true
    healthcheck:
      test: ["CMD", "/app/server", "health", "--mcp-listen-address", "localhost:50050"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      # Ensures that the http-echo-server is started before mcpany-server.
      http-echo-server:
        condition: service_healthy
    networks:
      - mcpany-net

  # A sample upstream HTTP service that mcpany-server will connect to.
  http-echo-server:
    image: mcpany/http-echo-server:latest
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/8080' 2>/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mcpany-net

networks:
  mcpany-net:
    driver: bridge

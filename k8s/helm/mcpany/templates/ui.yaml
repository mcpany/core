apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpany.fullname" . }}-ui
  labels:
    {{- include "mcpany.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcpany.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "mcpany.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            # BACKEND_URL is read at runtime by `vite preview` to configure
            # its reverse-proxy rules, so the container can be scaled freely.
            - name: BACKEND_URL
              value: "http://{{ include "mcpany.fullname" . }}:{{ .Values.service.jsonrpcPort }}"
            {{- if or .Values.ui.existingSecret .Values.ui.apiKey }}
            - name: MCPANY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.ui.existingSecret }}{{ .Values.ui.existingSecret }}{{ else }}{{ include "mcpany.fullname" . }}-ui-secret{{ end }}
                  key: {{ .Values.ui.secretKey | default "api-key" }}
            {{- end }}
          # Liveness: restart the pod if the process is completely unresponsive.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # Readiness: only route traffic once vite preview is fully ready.
          # This ensures rolling updates are safe and scale-in/scale-out
          # events do not introduce downtime.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpany.fullname" . }}-ui
  labels:
    {{- include "mcpany.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http
      name: http
      {{- if .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
  selector:
    {{- include "mcpany.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui

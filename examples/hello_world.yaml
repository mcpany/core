upstream_services:
  - name: hello-service
    http_service:
      address: https://echo.free.beeceptor.com
      tools:
        - name: hello
          description: "Say hello"
          call_id: "hello-call"
          input_schema:
            type: "object"
            properties: {}
      calls:
        "hello-call":
          endpoint_path: /hello
          method: "HTTP_METHOD_GET"
